<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SxxLogViewer</title>
<!-- アセットは CDN / vendor をサーバが切り替える (asset mode: {{ASSET_MODE}}) -->
<link href="{{ASSET_DAISYUI_CSS}}" rel="stylesheet" type="text/css">
<link href="{{ASSET_THEMES_CSS}}" rel="stylesheet" type="text/css">
<script src="{{ASSET_TAILWIND_JS}}"></script>
<style>
  html, body { height: 100%; margin: 0; }
  #logScroller { position: relative; }
  #logTable { table-layout: fixed; width: 100%; min-width: 1300px; }
  #logTable th, #logTable td { height: 27px; padding: 0 8px; line-height: 26px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; vertical-align: middle; box-sizing: border-box; }
  #logTable thead th { height: 32px; }
  #logTable tbody tr { height: 27px; }
  #logTable td .badge { height: 1.2rem; vertical-align: middle; }
  #logTable tr.spacer, #logTable tr.spacer td { height: auto; padding: 0; border: 0; background: none !important; }
  #logTable tr.spacer:hover td { background: none !important; }
  #logTable td.msgcell > div { display: flex; align-items: center; gap: .5rem; min-width: 0; }
  #logTable td.msgcell .txt { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #logTable td.msgcell .badge { flex: none; }
  #logTable tr.row-click { cursor: pointer; }
  #logTable tr.row-child td { background: color-mix(in oklab, var(--color-base-300) 35%, transparent); }
  #logTable tr.row-child td:first-child { box-shadow: inset 3px 0 0 var(--color-secondary); }
  #logTable tr.flash td { background: color-mix(in oklab, var(--color-warning) 35%, transparent) !important; }
  #logTable td.exc { padding: 0; }   /* alert を行の左端〜右端いっぱいに (以前は 4px 内側に寄って見えた) */
  #logTable td.exc .alert { height: 26px; min-height: 0; width: 100%; margin: 0; padding: 0 .75rem; border-radius: 0; overflow: hidden; display: flex; gap: .5rem; align-items: center; white-space: nowrap; }
  /* Label / Level バッジは固定幅・中央揃えで、どの値でも同じ形の箱にする */
  #logTable .badge.fixw { width: 4.75rem; min-width: 4.75rem; max-width: 4.75rem; justify-content: center; padding-inline: 0;
    overflow: hidden; text-overflow: clip; white-space: nowrap; display: inline-flex; vertical-align: middle; }
  #logTable .badge.lvl-debug { background: color-mix(in oklab, var(--color-base-content) 16%, var(--color-base-100));
    color: var(--color-base-content); border: 1px solid color-mix(in oklab, var(--color-base-content) 28%, transparent); }
  #logTable tr.flash td { background: color-mix(in oklab, var(--color-warning) 35%, transparent) !important; color: var(--color-warning-content) !important; }
  /* facet は daisyUI の radio と同じ見た目 (丸枠 + ON で内側に小さい塗り丸) だが、中身は複数選択の checkbox。
     daisyUI は .radio-sm のサイズ指定を [type=radio] にしか適用しないので、checkbox にも同じサイズを与える */
  .radio-sm[type=checkbox] { --size: calc(var(--size-selector, .25rem) * 5); }
  .facet-row { display: flex; align-items: center; gap: .5rem; padding: .25rem .5rem; border-radius: .375rem; cursor: pointer; }
  .facet-row:hover { background: color-mix(in oklab, var(--color-base-content) 10%, transparent); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .sxx-hl-line { background: rgba(250, 204, 21, .28); }
  .sxx-hl-glyph { background: #eab308; width: 4px !important; margin-left: 3px; }
  #codePanel { max-width: calc(100% - 426px); }  /* ログテーブルが最低 420px 残るように */
  .filelink { display: flex; min-width: 0; align-items: baseline; }
  .filelink .fdir { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; opacity: .7; }
  .filelink .fname { flex: none; font-weight: 700; }
  #splitter { width: 6px; cursor: col-resize; flex: none; }
  #splitter:hover, #splitter.drag { background: var(--color-primary); opacity: .6; }
  .stats .stat { padding: .35rem 1rem; }
  .stats .stat-value { font-size: 1.15rem; line-height: 1.5rem; }
  .stats .stat-title { font-size: .7rem; }
</style>
</head>
<body class="bg-base-100 text-base-content">

<div class="drawer lg:drawer-open h-screen">
  <input id="sidebarToggle" type="checkbox" class="drawer-toggle">

  <!-- ===== メイン ===== -->
  <div class="drawer-content flex flex-col h-screen min-w-0">
    <div id="serverDown" role="alert" class="alert alert-error rounded-none flex-none justify-center hidden">
      <span>サーバーが終了しました。start.bat から再起動してください。</span>
    </div>
    <div class="navbar bg-base-200 shadow-sm gap-1 flex-none min-h-12 px-2">
      <div class="flex-none lg:hidden">
        <label for="sidebarToggle" class="btn btn-square btn-ghost btn-sm" aria-label="フィルターを開く">&#9776;</label>
      </div>
      <div class="flex-none"><span class="text-lg font-bold px-2">SxxLogViewer</span></div>
      <div class="flex-1 flex items-center gap-2 min-w-0">
        <select id="logSelect" class="select select-sm w-64 max-w-full" title="log_dir 内のログ"></select>
        <label class="btn btn-sm" title="ログファイルを開く (ドラッグ&ドロップも可)">
          ファイルを開く
          <input id="fileInput" type="file" class="hidden" accept=".log,.txt,text/plain">
        </label>
        <button id="reloadBtn" class="btn btn-sm btn-ghost" title="再読み込み">再読み込み</button>
        <button id="jumpExcBtn" class="btn btn-sm btn-error btn-outline" title="Exception へジャンプ (押すたびに次へ)" disabled>
          Exception <span id="excCount" class="badge badge-error badge-sm">0</span>
        </button>
      </div>
      <div class="flex-none flex items-center gap-1">
        <button id="settingsBtn" class="btn btn-sm btn-ghost" title="設定">設定</button>
        <label class="swap swap-rotate btn btn-ghost btn-sm btn-circle" title="テーマ切替 (light / dark)">
          <input id="themeChk" type="checkbox" class="theme-controller" value="light">
          <span class="swap-off">&#9790;</span>
          <span class="swap-on">&#9728;</span>
        </label>
      </div>
    </div>

    <div id="statsBar" class="flex-none px-2 pt-2">
      <div class="stats stats-horizontal bg-base-200 w-full overflow-x-auto shadow-sm">
        <div class="stat"><div class="stat-title">profile</div><div id="stProfile" class="stat-value">-</div></div>
        <div class="stat"><div class="stat-title">main thread id</div><div id="stMain" class="stat-value">-</div></div>
        <div class="stat"><div class="stat-title">timestamp</div><div id="stTs" class="stat-value">-</div></div>
        <div class="stat"><div class="stat-title">ログ件数</div><div id="stCount" class="stat-value">-</div></div>
        <div class="stat"><div class="stat-title">Exception</div><div id="stExc" class="stat-value">-</div></div>
      </div>
    </div>

    <div id="notice" class="flex-none px-2 pt-2 hidden"></div>

    <div class="flex flex-1 min-h-0 px-2 py-2 gap-0">
      <!-- ログテーブル -->
      <div class="flex flex-col flex-1 min-w-0 min-h-0 relative">
        <div class="flex-none text-xs opacity-70 px-1 pb-1 flex justify-between">
          <span id="visibleInfo">&nbsp;</span>
          <span><kbd class="kbd kbd-xs">Ctrl</kbd>+<kbd class="kbd kbd-xs">F</kbd> 検索 / <kbd class="kbd kbd-xs">Esc</kbd> 閉じる</span>
        </div>
        <div id="logScroller" class="flex-1 min-h-0 overflow-auto rounded-box border border-base-300">
          <table id="logTable" class="table table-zebra table-pin-rows table-xs">
            <colgroup>
              <col style="width:76px"><col style="width:104px"><col style="width:300px"><col style="width:330px">
              <col style="width:140px"><col style="width:104px"><col>
            </colgroup>
            <thead>
              <tr><th class="text-right">#</th><th>Label</th><th>Timestamp</th><th>File:Line</th><th>Thread</th><th>Level</th><th>Message</th></tr>
            </thead>
            <tbody id="logBody"></tbody>
          </table>
          <div id="emptyState" class="hidden p-10 text-center opacity-70"></div>
          <div id="loading" class="hidden absolute inset-0 bg-base-100/60 flex items-center justify-center z-10">
            <span class="loading loading-spinner loading-lg"></span>
          </div>
        </div>
        <div id="dropOverlay" class="hidden absolute inset-0 z-20 rounded-box border-4 border-dashed border-primary bg-base-100/80 flex items-center justify-center text-xl font-bold pointer-events-none">
          ここにログファイルをドロップ
        </div>
      </div>

      <!-- Monaco パネル (右ドロワー) -->
      <div id="splitter" class="hidden"></div>
      <aside id="codePanel" class="hidden flex-col min-h-0 min-w-0 rounded-box border border-base-300 bg-base-100 overflow-hidden" style="width:48%">
        <div class="flex-none flex items-center gap-2 bg-base-200 px-3 py-2">
          <div class="min-w-0 flex-1">
            <div id="cpPath" class="mono text-sm font-semibold truncate" title=""></div>
            <div id="cpSub" class="text-xs opacity-70 truncate"></div>
          </div>
          <span id="cpLine" class="badge badge-warning badge-sm hidden"></span>
          <span id="cpLang" class="badge badge-ghost badge-sm hidden"></span>
          <button id="cpCopy" class="btn btn-xs" title="絶対パス:行 をクリップボードへ">パスをコピー</button>
          <button id="cpClose" class="btn btn-xs btn-ghost btn-square" title="閉じる (Esc)">&#10005;</button>
        </div>
        <div id="cpAlert" class="flex-none p-2 hidden"></div>
        <div id="cpCands" class="flex-none p-2 hidden"></div>
        <div id="cpBusy" class="hidden flex-1 flex items-center justify-center"><span class="loading loading-spinner"></span></div>
        <div id="editor" class="flex-1 min-h-0 hidden"></div>
      </aside>
    </div>
  </div>

  <!-- ===== サイドバー ===== -->
  <div class="drawer-side z-30">
    <label for="sidebarToggle" aria-label="閉じる" class="drawer-overlay"></label>
    <div class="bg-base-200 w-72 min-h-full h-full overflow-y-auto p-3 flex flex-col gap-3">
      <div class="font-bold text-lg px-1">フィルター</div>

      <div class="join w-full">
        <input id="q" type="text" class="input input-sm join-item flex-1 min-w-0" placeholder="message / filepath を検索" autocomplete="off">
        <button id="qRegex" type="button" class="btn btn-sm join-item mono" title="正規表現" aria-pressed="false">.*</button>
      </div>
      <div id="qErr" class="text-error text-xs hidden">正規表現が不正です</div>

      <div>
        <div class="text-xs opacity-70 px-1 pb-1">Stack のまとめ方</div>
        <select id="groupMode" class="select select-sm w-full">
          <option value="callsite">呼び出し箇所が同じ (既定)</option>
          <option value="exact">メッセージまで同じ</option>
          <option value="none">まとめない</option>
        </select>
      </div>

      <div id="facets" class="flex flex-col gap-2"></div>
      <div class="flex-1"></div>
      <div class="text-xs opacity-60 px-1">
        Stack グループは行クリックで展開/折り畳み。File:Line をクリックするとソースを右パネルに表示します。
      </div>
    </div>
  </div>
</div>

<!-- ===== モーダル ===== -->
<dialog id="excModal" class="modal">
  <div class="modal-box max-w-4xl">
    <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">&#10005;</button></form>
    <div id="excBody"></div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<dialog id="detailModal" class="modal">
  <div class="modal-box max-w-3xl">
    <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">&#10005;</button></form>
    <div id="detailBody"></div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<dialog id="settingsModal" class="modal">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-3">設定</h3>
    <div class="flex flex-col gap-3">
      <label class="form-control w-full">
        <div class="mb-1 text-sm">source_root (エンジンのリポジトリルート)</div>
        <div class="join w-full">
          <input id="setSourceRoot" type="text" class="input input-sm join-item flex-1 min-w-0 mono" placeholder="例: C:\Dev\SxavengerEngine">
          <button type="button" class="btn btn-sm join-item" data-pick="setSourceRoot" data-title="source_root (エンジンのリポジトリルート) を選択">参照…</button>
        </div>
        <div class="mt-1 text-xs opacity-70">ログ内の <span class="mono">Engine/Runtime/...</span> はこのディレクトリからの相対パスとして解決します。配下以外は開けません。</div>
      </label>
      <label class="form-control w-full">
        <div class="mb-1 text-sm">log_dir (ログのあるディレクトリ)</div>
        <div class="join w-full">
          <input id="setLogDir" type="text" class="input input-sm join-item flex-1 min-w-0 mono" placeholder="例: C:\Dev\SxavengerEngine\Logs">
          <button type="button" class="btn btn-sm join-item" data-pick="setLogDir" data-title="log_dir (ログのあるディレクトリ) を選択">参照…</button>
        </div>
      </label>
      <div id="setErr" class="alert alert-error alert-soft hidden text-sm"></div>
      <div class="text-xs opacity-60">ライブラリ読み込み: <span id="setAssets"></span></div>
    </div>
    <div class="modal-action">
      <button id="setSave" class="btn btn-primary btn-sm">保存</button>
      <form method="dialog"><button class="btn btn-sm">キャンセル</button></form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<div id="toasts" class="toast toast-end toast-bottom z-50"></div>

<script>
"use strict";
const MONACO_VS = "{{ASSET_MONACO_VS}}";
const ASSET_MODE = "{{ASSET_MODE}}";
let ROW_H = 28; const OVERSCAN = 14;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n).toLocaleString("ja-JP");

const state = {
  cfg: null, logs: [], data: null, source: null,
  filters: { label: new Set(), thread: new Set(), level: new Set() },
  query: "", regex: false, expanded: new Set(), rows: [], flashId: null, excIdx: -1, reqSeq: 0,
};

/* ---------- 共通ユーティリティ ---------- */
async function api(path, opts) {
  const r = await fetch(path, opts);
  let body = null;
  try { body = await r.json(); } catch (_) { /* 非 JSON */ }
  if (!r.ok) {
    const e = new Error((body && body.message) || r.statusText || "通信エラー");
    e.code = body && body.error; e.status = r.status;
    throw e;
  }
  return body;
}
const postJson = (path, obj) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(obj) });

function toast(msg, kind = "info") {
  const el = document.createElement("div");
  el.className = `alert alert-${kind} text-sm py-2`;
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function showNotice(html, kind = "error") {
  const n = $("#notice");
  n.innerHTML = `<div class="alert alert-${kind} alert-soft py-2 text-sm"><span>${html}</span><button class="btn btn-xs btn-ghost" onclick="this.closest('#notice').classList.add('hidden')">&#10005;</button></div>`;
  n.classList.remove("hidden");
}
function clearNotice() { $("#notice").classList.add("hidden"); }

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }
  toast("コピーしました", "success");
}

/* ---------- テーマ ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("#themeChk").checked = t === "light";
  if (window.monaco) window.monaco.editor.setTheme(t === "dark" ? "vs-dark" : "vs");
}
$("#themeChk").addEventListener("change", e => {
  const t = e.target.checked ? "light" : "dark";
  applyTheme(t);
  postJson("/api/config", { theme: t }).catch(() => {});
});

/* ---------- 表示ヘルパ ---------- */
function levelBadge(level) {
  const l = String(level).toLowerCase();
  let c = "badge-outline";
  if (l === "debug") c = "lvl-debug";
  else if (l === "info") c = "badge-info";
  else if (l === "warning" || l === "warn") c = "badge-warning";
  else if (["error", "critical", "fatal"].includes(l)) c = "badge-error";
  return `<span class="badge badge-sm fixw ${c}" title="${esc(level)}">${esc(level)}</span>`;
}
function labelBadge(label) {
  const c = label === "Stack" ? "badge-secondary" : label === "Stream" ? "badge-primary" : "badge-neutral";
  return `<span class="badge badge-sm fixw badge-outline ${c}">${esc(label)}</span>`;
}
function threadCell(t) {
  return t === "main thread" ? `<span class="font-semibold text-accent">${esc(t)}</span>` : `<span class="opacity-80">${esc(t)}</span>`;
}
function splitPath(p) { const i = p.lastIndexOf("/"); return i < 0 ? ["", p] : [p.slice(0, i + 1), p.slice(i + 1)]; }
// ディレクトリ部分だけを左側から省略し、ファイル名:行番号は常に全文を表示する
function fileLink(file, line, extra = "") {
  if (!file) return "";
  const lbl = line != null ? `${file}:${line}` : file;
  const [dir, base] = splitPath(String(file).replace(/\\/g, "/"));
  const name = line != null ? `${base}:${line}` : base;
  const avail = Math.max(0, 44 - name.length);
  const shownDir = dir.length <= avail ? dir : (avail > 2 ? "\u2026" + dir.slice(dir.length - (avail - 1)) : (dir ? "\u2026/" : ""));
  return `<a href="#" class="link link-primary link-hover mono filelink ${extra}" data-act="src" data-path="${esc(file)}" data-line="${line ?? ""}" title="${esc(lbl)}"><span class="fdir">${esc(shownDir)}</span><span class="fname">${esc(name)}</span></a>`;
}
function msgText(m) {
  const s = m.length > 600 ? m.slice(0, 600) : m;
  return esc(s.replace(/\r?\n/g, " \u23CE "));
}
function tsRange(g) {   // 要件どおり first ~ last を両方フル表示 (同一なら単一)
  return g.first_ts === g.last_ts ? esc(g.first_ts) : `${esc(g.first_ts)} ~ ${esc(g.last_ts)}`;
}

/* ---------- フィルター (サイドバー) ---------- */
const FACET_TITLES = { label: "Label", thread: "Thread", level: "Level" };
// keep=true (同じログの再読み込み / まとめ方変更) なら選択状態を引き継ぎ、新規出現値は選択状態で追加する
function buildFacets(keep) {
  const f = state.data.facets, box = $("#facets");
  const prevKnown = state.known || {};
  state.known = {};
  box.innerHTML = "";
  for (const key of ["label", "thread", "level"]) {
    const values = Object.keys(f[key]);
    const prevSel = state.filters[key], known = prevKnown[key] || new Set();
    state.known[key] = new Set(values);
    state.filters[key] = new Set(keep ? values.filter(v => prevSel.has(v) || !known.has(v)) : values);
    const items = Object.entries(f[key]);
    const det = document.createElement("details");
    det.className = "collapse collapse-arrow bg-base-100 border border-base-300";
    det.open = true;
    det.innerHTML = `
      <summary class="collapse-title text-sm font-semibold py-2 min-h-0">${FACET_TITLES[key]} <span class="badge badge-ghost badge-xs">${items.length}</span></summary>
      <div class="collapse-content px-2 pb-2">
        <div class="flex gap-1 mb-1">
          <button class="btn btn-xs btn-ghost" data-facet-all="${key}">全選択</button>
          <button class="btn btn-xs btn-ghost" data-facet-none="${key}">全解除</button>
        </div>
        <ul class="menu menu-xs p-0 max-h-56 overflow-y-auto flex-nowrap w-full">
          ${items.map(([v, n]) => `
            <li><label class="facet-row">
              <input type="checkbox" class="radio radio-primary radio-sm" data-facet="${key}" value="${esc(v)}" ${state.filters[key].has(v) ? "checked" : ""}>
              <span class="flex-1 truncate" title="${esc(v)}">${esc(v)}</span>
              <span class="badge badge-sm">${fmt(n)}</span>
            </label></li>`).join("")}
        </ul>
      </div>`;
    box.appendChild(det);
  }
}
$("#facets").addEventListener("change", e => {
  const cb = e.target.closest("input[data-facet]");
  if (!cb) return;
  const set = state.filters[cb.dataset.facet];
  cb.checked ? set.add(cb.value) : set.delete(cb.value);
  refresh();
});
$("#facets").addEventListener("click", e => {
  const b = e.target.closest("button[data-facet-all],button[data-facet-none]");
  if (!b) return;
  const key = b.dataset.facetAll || b.dataset.facetNone, all = !!b.dataset.facetAll;
  state.filters[key] = new Set(all ? Object.keys(state.data.facets[key]) : []);
  document.querySelectorAll(`input[data-facet="${key}"]`).forEach(cb => { cb.checked = all; });
  refresh();
});
let qTimer = null;
$("#q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.query = e.target.value; refresh(); }, 180);
});
$("#qRegex").addEventListener("click", e => {
  state.regex = !state.regex;
  e.currentTarget.classList.toggle("btn-primary", state.regex);
  e.currentTarget.setAttribute("aria-pressed", String(state.regex));
  refresh();
});
$("#groupMode").addEventListener("change", async e => {
  postJson("/api/config", { group_mode: e.target.value }).catch(() => {});
  state.expanded.clear();
  await reloadCurrent();
});

/* ---------- 行の組み立てと仮想スクロール ---------- */
function buildMatcher() {
  const q = state.query.trim();
  $("#qErr").classList.add("hidden"); $("#q").classList.remove("input-error");
  if (!q) return null;
  if (state.regex) {
    try { const re = new RegExp(q, "i"); return s => re.test(s); }

  const facetOk = e => f.label.has(e.label) && f.thread.has(e.thread) && f.level.has(e.level);
  for (const e of state.data.entries) {
    switch (e.kind) {
      case "log":
        if (facetOk(e) && (!m || m(e.message) || m(e.file))) rows.push({ t: "log", e });
        break;
      case "stack_group": {

        rows.push({ t: "group", e, hit: kids.length });
        if (state.expanded.has(e.id)) for (const c of kids) rows.push({ t: "child", e: c });
        break;

const scroller = $("#logScroller"), tbody = $("#logBody");

function render(force) {

  const end = Math.min(total, start + Math.ceil(scroller.clientHeight / ROW_H) + OVERSCAN * 2);

  let html = `<tr class="spacer" style="height:${start * ROW_H}px"><td colspan="7"></td></tr>`;

let monacoPromise = null, editor = null, curModel = null, decos = [];
function loadMonaco() {

  const root = base.replace(/\/vs$/, "");
  monacoPromise = new Promise((resolve, reject) => {
    window.MonacoEnvironment = {
      getWorkerUrl: () => "data:text/javascript;charset=utf-8," + encodeURIComponent(
        `self.MonacoEnvironment={baseUrl:${JSON.stringify(root + "/")}};importScripts(${JSON.stringify(base + "/base/worker/workerMain.js")});`),
    };
    const s = document.createElement("script");
    s.src = base + "/loader.js";
    s.onerror = () => reject(new Error(`Monaco を読み込めません (${s.src})。ネットワーク接続を確認するか、tools/setup_vendor.py でオフライン用ファイルを取得してください。`));
    s.onload = () => {
      window.require.config({ paths: { vs: base } });
      window.require(["vs/editor/editor.main"], () => resolve(window.monaco), err => reject(new Error("Monaco の初期化に失敗: " + (err && err.message || err))));
    };
    document.head.appendChild(s);

const panel = $("#codePanel");

    <ul class="menu bg-base-200 rounded-box w-full">

    </ul>`;

async function openSource(path, line, opts = {}) {
  const req = ++panelReq;
  panelOpen(); clearPanelAlert(); panelState("busy");
  $("#cpPath").textContent = path; $("#cpPath").title = path;
  $("#cpSub").textContent = "";
  $("#cpLine").classList.toggle("hidden", line == null); $("#cpLine").textContent = line != null ? `L${line}` : "";
  $("#cpLang").classList.add("hidden");
  curSrc = { path, line, abs: null };
  try {
    const p = String(path).replace(/\\/g, "/");
    // ファイル名のみ (スタックフレーム) は /api/find で候補を出す
    if (!opts.direct && !p.includes("/")) {
      const r = await api(`/api/find?name=${encodeURIComponent(p)}`);
      if (req !== panelReq) return;
      if (r.candidates.length === 0) {
        panelState("none");
        panelAlert(`<b>${esc(p)}</b> が source_root 以下に見つかりません。`, "warning", true);
        return;
      }
      if (r.candidates.length > 1) {
        panelState("none");
        showCandidates(p, line, r.candidates, `<b>${esc(p)}</b> の候補が ${r.candidates.length} 件あります。開くファイルを選んでください。`);
        return;
      }
      return openSource(r.candidates[0], line, { direct: true });
    }
    const src = await api(`/api/source?path=${encodeURIComponent(p)}`);
    if (req !== panelReq) return;
    await showInEditor(src, line, req);
  } catch (e) {
    if (req !== panelReq) return;
    panelState("none");
    const p = String(path).replace(/\\/g, "/");
    if (e.code === "no_root") {
      panelAlert("source_root が未設定、または存在しません。設定でエンジンのリポジトリルートを指定してください。", "warning", true);
    } else if (e.code === "not_found" || e.code === "outside_root") {
      panelAlert(`${esc(e.message)}`, e.code === "outside_root" ? "error" : "warning", true);
      // 同名ファイルの候補を探す (source_root が別階層のとき用)
      try {
        const base = p.split("/").pop();
        const r = await api(`/api/find?name=${encodeURIComponent(base)}`);
        if (req === panelReq && r.candidates.length && e.code === "not_found") {
          showCandidates(base, line, r.candidates, `同名ファイルの候補 (${r.candidates.length} 件):`);
        }
      } catch (_) { /* 候補なし */ }

    }
  }
}

  if (req !== panelReq) return;
  panelState("editor");
  if (!editor) {
    editor = monaco.editor.create($("#editor"), {
      readOnly: true, automaticLayout: true, theme: document.documentElement.dataset.theme === "dark" ? "vs-dark" : "vs",
      minimap: { enabled: true }, scrollBeyondLastLine: false, glyphMargin: true, renderLineHighlight: "none",
      fontSize: 13, domReadOnly: true, wordWrap: "off",

  if (old) old.dispose();
  curSrc = { path: src.path, line, abs: src.abs };
  $("#cpPath").textContent = src.path; $("#cpPath").title = src.abs;
  $("#cpSub").textContent = src.abs;
  $("#cpLang").textContent = src.language; $("#cpLang").classList.remove("hidden");
  editor.layout();
  decos = editor.deltaDecorations(decos, []);
  if (line != null) {
    const total = curModel.getLineCount();
    const ln = Math.min(Math.max(1, line), total);
    if (ln !== line) panelAlert(`指定の行 ${line} がファイルの行数 (${total}) を超えているため、最終行を表示しています。ソースがログ出力時と異なる可能性があります。`, "warning");
    decos = editor.deltaDecorations([], [{
      range: new monaco.Range(ln, 1, ln, 1),
      options: { isWholeLine: true, className: "sxx-hl-line", glyphMarginClassName: "sxx-hl-glyph" },
    }]);
    editor.setPosition({ lineNumber: ln, column: 1 });
    editor.revealLineInCenter(ln);
  } else {
    editor.setScrollTop(0);
  }
}
$("#cpCopy").addEventListener("click", () => {
  if (!curSrc) return;
  const base = curSrc.abs || curSrc.path;
  copyText(curSrc.line != null ? `${base}:${curSrc.line}` : base);
});
/* スプリッタ */
(() => {
  const sp = $("#splitter");
  let startX = 0, startW = 0;
  sp.addEventListener("pointerdown", e => {
    startX = e.clientX; startW = panel.getBoundingClientRect().width;
    sp.setPointerCapture(e.pointerId); sp.classList.add("drag");
  });
  sp.addEventListener("pointermove", e => {
    if (!sp.classList.contains("drag")) return;
    const max = Math.max(200, panel.parentElement.clientWidth - MIN_LOG_W - 6);
    panel.style.width = Math.min(Math.max(Math.min(320, max), startW + (startX - e.clientX)), max) + "px";
  });
  const end = e => { sp.classList.remove("drag"); try { sp.releasePointerCapture(e.pointerId); } catch (_) {} };
  sp.addEventListener("pointerup", end); sp.addEventListener("pointercancel", end);
})();

/* ---------- 設定 ---------- */
function openSettings() {
  $("#setSourceRoot").value = state.cfg ? state.cfg.source_root : "";
  $("#setLogDir").value = state.cfg ? state.cfg.log_dir : "";
  $("#setErr").classList.add("hidden");
  $("#setAssets").textContent = ({ vendor: "vendor (ローカル)", cdn: "CDN (jsDelivr)", mixed: "一部 vendor / 一部 CDN" })[ASSET_MODE] || ASSET_MODE;
  $("#settingsModal").showModal();
}
$("#settingsBtn").addEventListener("click", openSettings);
/* 「参照…」: サーバ側 (この PC) でネイティブのフォルダ選択ダイアログを開く。保存は「保存」ボタン */
document.querySelectorAll("[data-pick]").forEach(btn => btn.addEventListener("click", async () => {
  if (btn.disabled) return;
  const input = document.getElementById(btn.dataset.pick), label = btn.textContent;
  document.querySelectorAll("[data-pick]").forEach(b => { b.disabled = true; });
  btn.innerHTML = '<span class="loading loading-spinner loading-xs"></span>';
  $("#setErr").classList.add("hidden");
  try {
    const r = await postJson("/api/pick-folder", { initial: input.value.trim(), title: btn.dataset.title });
    if (r.path) input.value = r.path;
  } catch (e) {
    $("#setErr").textContent = e.status === 501 ? "この環境ではフォルダ選択ダイアログを開けません。テキストで入力してください。" : e.message;
    $("#setErr").classList.remove("hidden");
  } finally {
    btn.textContent = label;
    document.querySelectorAll("[data-pick]").forEach(b => { b.disabled = false; });
  }
}));
$("#setSave").addEventListener("click", async () => {
  try {
    const before = state.cfg ? state.cfg.log_dir : "";
    state.cfg = await postJson("/api/config", { source_root: $("#setSourceRoot").value, log_dir: $("#setLogDir").value });
    $("#settingsModal").close();
    toast("設定を保存しました", "success");
    if (state.cfg.warning) toast(state.cfg.warning, "warning");
    await loadLogList();
    if (state.cfg.log_dir !== before && state.logs.length && (!state.source || state.source.type === "server")) loadServerLog(state.logs[0].name);
    updateInfo();
    if (!$("#codePanel").classList.contains("hidden") && curSrc) openSource(curSrc.path, curSrc.line);
  } catch (e) {
    $("#setErr").textContent = e.message; $("#setErr").classList.remove("hidden");
  }
});

/* ---------- キーボード ---------- */
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "f") {
    if (ev.target.closest && ev.target.closest("#editor")) return;   // Monaco 内は Monaco の検索
    ev.preventDefault();
    const q = $("#q");
    $("#sidebarToggle").checked = true;
    q.focus(); q.select();
  } else if (ev.key === "Escape") {
    if (document.querySelector("dialog[open]")) return;               // dialog は標準動作で閉じる
    if (!panel.classList.contains("hidden")) { panelClose(); }
    else if (document.activeElement === $("#q") && $("#q").value) { $("#q").value = ""; state.query = ""; refresh(); }
  }
});

/* ---------- 生存確認 (SSE) ----------
   タブが開いている間 /api/alive をつなぎっぱなしにする。タブを閉じると切断され、サーバが全タブの切断を検知して自動終了する。
   タイマー(setInterval)は非表示タブで間引かれるため使わない。 */
(function watchAlive() {
  if (!window.EventSource) return;
  const es = new EventSource("/api/alive");
  let leaving = false;
  window.addEventListener("pagehide", () => { leaving = true; es.close(); });
  window.addEventListener("beforeunload", () => { leaving = true; });
  es.onerror = () => {      // サーバ終了。自動再接続で騒がないよう閉じて、画面上部に知らせる
    es.close();
    if (!leaving) $("#serverDown").classList.remove("hidden");
  };
})();

/* ---------- 初期化 ---------- */
(async function init() {
  try {
    state.cfg = await api("/api/config");
    applyTheme(state.cfg.theme || "dark");
    $("#groupMode").value = state.cfg.group_mode || "callsite";
    if (state.cfg.warning) toast(state.cfg.warning, "warning");
  } catch (e) { showNotice(`設定を取得できません: ${esc(e.message)}`); }
  updateInfo();
  await loadLogList();
  const want = new URLSearchParams(location.search).get("log");
  const first = want && state.logs.some(l => l.name === want) ? want : (state.logs[0] && state.logs[0].name);
  if (first) await loadServerLog(first);
  // 一覧に無い ?log= 指定は無視 (サーバ側でも log_dir 直下のみ許可)
  window.__ready = true;
})();
</script>
